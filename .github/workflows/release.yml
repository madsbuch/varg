name: Release Android

# Builds a signed Android APK on every merge to main and publishes it as a
# rolling `latest` prerelease — no version bump required.
#
# Two kinds of release come out of this workflow:
#
#   latest    refreshed on every push to main, marked prerelease.
#             Permanent download URL: /releases/tag/latest
#   v<x.y.z>  cut when the package.json version lands on main for the first
#             time, or when you push a `v*` tag by hand. Keeps the "Latest"
#             badge, and also ships an AAB.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEY_BASE64        base64 of your keystore (.jks/.keystore)
#   ANDROID_KEY_ALIAS         the key alias inside the keystore
#   ANDROID_KEY_PASSWORD      the key password
#   ANDROID_KEYSTORE_PASSWORD the keystore (store) password
#                             (optional — falls back to ANDROID_KEY_PASSWORD)
#
# If your secrets use different names, adjust the `env:` block in the
# "Configure signing" step below — that's the only place they're referenced.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Versioned tag to cut (e.g. v0.6.0). Leave empty for a rolling build."
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  # A newer merge supersedes an in-flight build of an older one.
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      rolling: ${{ steps.resolve.outputs.rolling }}
      versioned: ${{ steps.resolve.outputs.versioned }}
      version_tag: ${{ steps.resolve.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve what to publish
        id: resolve
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          ROLLING=false
          VERSIONED=false
          VERSION_TAG=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${INPUT_TAG:-}" ]; then
            VERSIONED=true
            VERSION_TAG="$INPUT_TAG"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSIONED=true
            VERSION_TAG="${GITHUB_REF_NAME}"
          else
            # Push to main (or a manual run with no tag): always refresh the
            # rolling build, and additionally cut v<package.json version> the
            # first time that version reaches main.
            ROLLING=true
            CANDIDATE="v$(jq -r .version package.json)"
            if git ls-remote --exit-code --tags origin "refs/tags/$CANDIDATE" >/dev/null 2>&1; then
              echo "Tag $CANDIDATE already exists — rolling build only."
            else
              echo "Version $CANDIDATE is new — cutting a versioned release too."
              VERSIONED=true
              VERSION_TAG="$CANDIDATE"
            fi
          fi

          {
            echo "rolling=$ROLLING"
            echo "versioned=$VERSIONED"
            echo "version_tag=$VERSION_TAG"
          } >> "$GITHUB_OUTPUT"

  android:
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is derived from the commit count — needs full history.
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + platforms
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pin a monotonic versionCode
        # Tauri derives versionCode from semver (0.5.6 → 5006), so every build
        # between two version bumps would carry the same code and the phone
        # couldn't tell them apart. Commit count is strictly increasing and
        # independent of the version, and the 10000 offset keeps it above the
        # highest semver-derived code already shipped (5006 for v0.5.6).
        run: |
          set -euo pipefail
          CODE=$(( 10000 + $(git rev-list --count HEAD) ))
          jq --argjson c "$CODE" '.bundle.android.versionCode = $c' \
            src-tauri/tauri.conf.json > /tmp/conf.json
          mv /tmp/conf.json src-tauri/tauri.conf.json
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "versionCode=$CODE"

      - name: Generate icons
        run: bun run icons

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked || true

      - name: Initialise Android project
        run: bun run tauri android init --ci

      - name: Warm up Gradle wrapper
        # The wrapper downloads the Gradle distribution on first use; that
        # download occasionally 504s. Retry it here, cheaply, so the real
        # build step never dies on a transient CDN failure.
        run: |
          cd src-tauri/gen/android
          for i in 1 2 3 4; do
            ./gradlew --version && exit 0
            echo "Gradle warm-up attempt $i failed; retrying in $((i * 20))s…"
            sleep $((i * 20))
          done
          exit 1

      - name: Apply app icons to Android project
        # `tauri android init` seeds res/ with the default Tauri logos;
        # overwrite them with the committed Varg icon set.
        run: |
          cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/
          echo "Applied icons:"
          find src-tauri/gen/android/app/src/main/res -name 'ic_launcher*' | head -20

      - name: Configure signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          GRADLE_DIR="src-tauri/gen/android"

          if [ -z "${ANDROID_KEY_BASE64:-}" ]; then
            # No signing secrets configured: generate an EPHEMERAL keystore so
            # the release still ships a signed, installable APK. The signature
            # changes every run, so Android won't in-place update between
            # releases until real secrets are added (see README "Signed
            # releases"). Loud, but not fatal.
            echo "::warning::No ANDROID_KEY_BASE64 secret found — signing with an EPHEMERAL keystore."
            echo "::warning::Add ANDROID_KEY_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD repo secrets for a stable signature."
            {
              echo "### ⚠️ Signed with an ephemeral keystore"
              echo "No \`ANDROID_KEY_*\` secrets are configured, so this APK is signed"
              echo "with a one-off key generated during the build. Installs fine, but"
              echo "the next build won't install as an update over this one."
              echo "Add the secrets from the README to get a stable signature."
            } >> "$GITHUB_STEP_SUMMARY"
            KEYSTORE="$RUNNER_TEMP/varg-ephemeral.keystore"
            ANDROID_KEY_ALIAS="varg"
            ANDROID_KEY_PASSWORD="$(openssl rand -hex 16)"
            echo "::add-mask::$ANDROID_KEY_PASSWORD"
            STORE_PW="$ANDROID_KEY_PASSWORD"
            keytool -genkeypair -v -keystore "$KEYSTORE" \
              -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PW" -keypass "$ANDROID_KEY_PASSWORD" \
              -dname "CN=Varg Release, O=Varg"
          else
            KEYSTORE="$RUNNER_TEMP/varg.keystore"
            echo "$ANDROID_KEY_BASE64" | base64 -d > "$KEYSTORE"
            STORE_PW="${ANDROID_KEYSTORE_PASSWORD:-$ANDROID_KEY_PASSWORD}"
          fi
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storePassword=$STORE_PW"
            echo "storeFile=$KEYSTORE"
          } > "$GRADLE_DIR/keystore.properties"

          # Inject a release signingConfig into the generated build.gradle.kts.
          python3 scripts/inject-signing.py "$GRADLE_DIR/app/build.gradle.kts"

          echo "----- build.gradle.kts (head) -----"
          sed -n '1,60p' "$GRADLE_DIR/app/build.gradle.kts"

      - name: Build signed APK (+ AAB for versioned releases)
        # The AAB is only useful for a store upload, so rolling builds skip it.
        run: |
          set -euo pipefail
          if [ "${{ needs.meta.outputs.versioned }}" = "true" ]; then
            bun run tauri android build --apk --aab
          else
            bun run tauri android build --apk
          fi

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p build
          find src-tauri/gen/android -path '*/outputs/apk/*/release/*.apk' -exec cp {} build/varg.apk \; || true
          find src-tauri/gen/android -path '*/outputs/bundle/*.aab' -exec cp {} build/varg.aab \; || true
          if [ ! -f build/varg.apk ]; then
            echo "::error::No APK produced."
            find src-tauri/gen/android -name '*.apk' -o -name '*.aab' || true
            exit 1
          fi
          echo "Artifacts:"; ls -la build

      - name: Verify the signing certificate
        # Catches a silent regression to ephemeral signing: if this fingerprint
        # ever changes, installs will start requiring an uninstall first.
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs build/varg.apk | tee /tmp/certs.txt
          {
            echo "### Signing certificate"
            echo '```'
            grep -i "DN:\|SHA-256 digest" /tmp/certs.txt
            echo '```'
            echo "versionCode \`${VERSION_CODE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: varg-android
          path: build/*

      - name: Publish rolling build
        if: needs.meta.outputs.rolling == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp build/varg.apk varg-latest.apk
          cat > /tmp/notes.md <<EOF
          Rolling build of \`main\`, refreshed on every merge — always the newest code.

          Built from ${GITHUB_SHA} · versionCode ${VERSION_CODE}

          Installs in place over any other build signed with the release key;
          no uninstall needed.
          EOF
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest varg-latest.apk \
            --title "Varg (latest build)" \
            --prerelease \
            --notes-file /tmp/notes.md

      - name: Stage versioned artifacts
        if: needs.meta.outputs.versioned == 'true'
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.version_tag }}"
          mkdir -p dist-artifacts
          cp build/varg.apk "dist-artifacts/varg-${TAG}.apk"
          if [ -f build/varg.aab ]; then
            cp build/varg.aab "dist-artifacts/varg-${TAG}.aab"
          fi
          ls -la dist-artifacts

      - name: Publish versioned release
        if: needs.meta.outputs.versioned == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.version_tag }}
          name: Varg ${{ needs.meta.outputs.version_tag }}
          generate_release_notes: true
          files: dist-artifacts/*
