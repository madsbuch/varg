name: Release Android

# One permanent release and one signing identity. Never generate a fallback key.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-android
  cancel-in-progress: true

env:
  # Public certificate fingerprint, verified against the existing latest APK
  # and ~/.tauri/keystores/varg-upload.jks. Changing this breaks upgrades.
  ANDROID_SIGNING_SHA256: 3cfecd7836895a978210db2f475cb62dbe65a1e2e79f71c4a52975ee600d24b8

jobs:
  android:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install NDK + platforms
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pin a monotonic versionCode
        # Existing releases used 10000 + commit count (10039 at migration).
        # A higher offset and workflow run number also cover manual releases.
        run: |
          set -euo pipefail
          CODE=$((100000 + GITHUB_RUN_NUMBER))
          jq --argjson c "$CODE" '.bundle.android.versionCode = $c' \
            src-tauri/tauri.conf.json > "$RUNNER_TEMP/tauri.conf.json"
          mv "$RUNNER_TEMP/tauri.conf.json" src-tauri/tauri.conf.json
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Generate icons
        run: bun run icons

      - name: Initialise Android project
        run: bun run tauri android init --ci

      - name: Warm up Gradle wrapper
        # The wrapper downloads the Gradle distribution on first use; that
        # download occasionally 504s. Retry it here, cheaply, so the real
        # build step never dies on a transient CDN failure.
        run: |
          cd src-tauri/gen/android
          for i in 1 2 3 4; do
            ./gradlew --version && exit 0
            echo "Gradle warm-up attempt $i failed; retrying in $((i * 20))s…"
            sleep $((i * 20))
          done
          exit 1

      - name: Apply app icons to Android project
        # `tauri android init` seeds res/ with the default Tauri logos;
        # overwrite them with the committed Varg icon set.
        run: |
          cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/
          echo "Applied icons:"
          find src-tauri/gen/android/app/src/main/res -name 'ic_launcher*' | head -20

      - name: Configure signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 scripts/configure-signing.py

      - name: Build signed APK
        run: bun run tauri android build --apk

      - name: Collect artifact
        run: |
          set -euo pipefail
          mkdir -p build
          mapfile -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk/universal/release -name '*.apk')
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one universal release APK, found ${#APKS[@]}."
            exit 1
          fi
          cp "${APKS[0]}" build/varg-latest.apk

      - name: Verify APK identity and version
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          "$TOOLS/apksigner" verify --print-certs build/varg-latest.apk > "$RUNNER_TEMP/certs.txt"
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt")
          if [ "$ACTUAL" != "$ANDROID_SIGNING_SHA256" ]; then
            echo "::error::APK signing certificate does not match the existing Varg release key."
            exit 1
          fi
          "$TOOLS/aapt" dump badging build/varg-latest.apk > "$RUNNER_TEMP/apk-info.txt"
          grep -q "^package: name='com.varg.workout' versionCode='$VERSION_CODE'" "$RUNNER_TEMP/apk-info.txt"
          {
            echo "### Verified release"
            echo "versionCode: $VERSION_CODE"
            echo "Signing certificate SHA-256: $ACTUAL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: varg-android
          path: build/*

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # An old manual rerun must never replace a newer main build.
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "A newer commit is on main; leaving the current release alone."
            exit 0
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Latest Varg Android build, updated on every push to main.

          Built from ${GITHUB_SHA} · versionCode ${VERSION_CODE}

          Download **varg-latest.apk** below and install it over your existing
          release-key-signed Varg installation. Your workout data stays in place.

          Signing certificate SHA-256: ${ANDROID_SIGNING_SHA256}
          EOF
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force
          # Preserve the release and its permanent download URL across builds.
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest build/varg-latest.apk --clobber
            gh release edit latest --title "Varg (latest build)" \
              --prerelease=false --latest --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create latest build/varg-latest.apk --verify-tag \
              --title "Varg (latest build)" --latest --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Remove signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/varg.keystore" src-tauri/gen/android/keystore.properties
