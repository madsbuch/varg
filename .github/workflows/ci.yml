name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Type-check & build
        run: bun run build
      - name: Built-in content check
        run: bun run check:content
      - name: Workout recording, animation and store-contract tests
        run: bun run test

  store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Storage (Diesel) tests
        working-directory: src-tauri/store
        run: cargo test
      - name: Storage lint
        working-directory: src-tauri/store
        run: cargo clippy --all-targets -- -D warnings
