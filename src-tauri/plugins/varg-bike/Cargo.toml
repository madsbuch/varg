[package]
name = "tauri-plugin-varg-bike"
version = "0.1.0"
edition = "2021"
description = "Varg's bike link: Bluetooth LE to an indoor bike's power, cadence and energy (FTMS / Cycling Power)"
links = "tauri-plugin-varg-bike"
publish = false

[dependencies]
tauri = { version = "2", default-features = false }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
