[package]
name = "tauri-plugin-varg-gps"
version = "0.1.0"
edition = "2021"
description = "Varg's run tracker: an Android foreground location service that keeps measuring while the phone is locked"
links = "tauri-plugin-varg-gps"
publish = false

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
