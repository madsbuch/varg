[package]
name = "tauri-plugin-varg-hr"
version = "0.1.0"
edition = "2021"
description = "Varg's heart-rate link: Bluetooth LE to a chest strap's Heart Rate Service, kept alive by a foreground service during a workout"
links = "tauri-plugin-varg-hr"
publish = false

[dependencies]
tauri = { version = "2", default-features = false }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
