[package]
name = "varg"
version = "0.4.0"
description = "Varg — military-style workout tracker"
authors = ["Varg"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix keeps the desktop binary and the Android/iOS shared
# library from colliding on name.
name = "varg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
# Android Back at the root has to quit the app itself: registering a back
# handler suppresses the platform's native exit. See src/lib/back.ts.
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
