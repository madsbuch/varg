[package]
name = "varg"
version = "0.4.0"
description = "Varg — military-style workout tracker"
authors = ["Varg"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix keeps the desktop binary and the Android/iOS shared
# library from colliding on name.
name = "varg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
# Android Back at the root has to quit the app itself: registering a back
# handler suppresses the platform's native exit. See src/lib/back.ts.
tauri-plugin-process = "2"
# In-repo plugin: the Android foreground location service that measures
# for-time runs while the phone is locked. See plugins/varg-gps.
tauri-plugin-varg-gps = { path = "plugins/varg-gps" }
# In-repo plugin: Android TextToSpeech for spoken pose names. See plugins/varg-voice.
tauri-plugin-varg-voice = { path = "plugins/varg-voice" }
# In-repo plugin: Bluetooth LE link to an indoor bike (FTMS / Cycling Power). See plugins/varg-bike.
tauri-plugin-varg-bike = { path = "plugins/varg-bike" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
